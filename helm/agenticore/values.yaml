# Agenticore Helm values

replicaCount: 1

image:
  repository: agenticore
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8200

server:
  host: "0.0.0.0"
  port: 8200
  transport: sse
  apiKeys: ""

claude:
  binary: claude
  timeout: 3600
  profile: coding
  configDir: ""  # DEPRECATED — Claude Code uses ~/.claude/ by default

redis:
  url: "redis://redis:6379/0"
  keyPrefix: agenticore

otel:
  enabled: true
  endpoint: "http://otel-collector:4317"
  protocol: grpc
  logPrompts: false
  logToolDetails: true

github:
  token: ""

repos:
  root: /data/repos
  maxParallelJobs: 3
  jobTtlSeconds: 86400

persistence:
  repos:
    enabled: true
    size: 10Gi
    storageClass: ""
  jobs:
    enabled: true
    size: 1Gi
    storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Deploy Redis as a subchart dependency
redis-standalone:
  enabled: true
  image: redis:7-alpine
  port: 6379

agentihooks:
  url: ""
  path: ""
  syncInterval: 300
  bundleUrl: ""
  bundleSyncInterval: 300

agentihub:
  url: ""
  path: ""
  syncInterval: 300
  # hooks-utils MCP server: which tool categories to load in Claude subprocesses.
  # Valid: github confluence aws email messaging storage database compute observability smith agent utilities
  # Coding-safe default: github (clone/PR/token) + utilities (validation/markdown) only.
  # Excludes: database (arbitrary SQL), smith (subprocess exec), storage (filesystem delete),
  #           compute (lambda), messaging (webhook/SSRF), agent, aws, email, confluence.
  mcpCategories: "github,utilities"
  # Allowlist of exact tool names within the loaded categories.
  # get_env is excluded: it would expose K8s secrets (GITHUB_TOKEN, ANTHROPIC_AUTH_TOKEN, etc.)
  # to the Claude agent. All other github + utilities tools are safe for coding workflows.
  allowedTools: "github_get_token,github_clone_repo,github_create_pr,github_get_repo_info,git_summary,validate_mermaid,write_markdown,hooks_list_tools"

# Deploy OTEL collector
otelCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:latest

# Deploy Postgres for OTEL sink
postgres:
  enabled: true
  image: postgres:16-alpine
  database: agenticore
  user: agenticore
  password: agenticore
