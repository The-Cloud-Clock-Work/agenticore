[project]
name = "anton-google-auth"
version = "0.1.0"
description = "Pluggable Google OAuth login module for Anton FastAPI services"
license = {text = "MIT"}
authors = [
    {name = "The Cloud Clockwork"},
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "redis>=5.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "fakeredis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anton_google_auth"]

[tool.hatch.build]
include = [
    "anton_google_auth/**",
]
