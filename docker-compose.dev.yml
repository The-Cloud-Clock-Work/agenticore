services:
  agenticore:
    build: .
    ports:
      - "8200:8200"
    volumes:
      - agenticore-shared:/shared
      - /home/iamroot/dev/agentihooks:/opt/agentihooks-src
      - ./docker/gateway-mcp.json:/shared/gateway-mcp.json:ro
    env_file:
      - .env
    environment:
      HOME: /shared
      AGENTIHOOKS_MCP_FILE: /shared/gateway-mcp.json

volumes:
  agenticore-shared:
