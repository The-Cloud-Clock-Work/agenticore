services:
  agenticore:
    build: .
    ports:
      - "8200:8200"
    volumes:
      - agenticore-shared:/shared
      # Dev loopback: bind-mount a local agentihooks checkout directly at the
      # destination derived from AGENTICORE_AGENTIHOOKS_URL. The runtime sees
      # an existing dir without `.git`, skips cloning, and runs editable
      # install in place. Edits land live on the next Python import.
      # AGENTIHOOKS_LOCAL_PATH defaults to a sibling checkout so this works
      # for any operator's clone layout, not just one hardcoded machine.
      - ${AGENTIHOOKS_LOCAL_PATH:-../agentihooks}:/shared/agentihooks
    env_file:
      - .env
    environment:
      HOME: /shared
      AGENTICORE_SHARED_FS_ROOT: /shared
      # URL is required to trigger the editable-install path. The bind-mount
      # above prevents an actual clone — the URL only names where to look
      # (last segment "agentihooks" → /shared/agentihooks).
      AGENTICORE_AGENTIHOOKS_URL: https://github.com/The-Cloud-Clockwork/agentihooks

volumes:
  agenticore-shared:
