name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'anton' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `python -m` throughout: on the self-hosted runner, pip's console scripts
      # land outside PATH, so bare `ruff`/`pytest` exit 127 even though the
      # install step succeeded. Going through the interpreter setup-python chose
      # is runner-agnostic.
      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint check
        run: python -m ruff check agenticore/ tests/

      - name: Format check
        run: python -m ruff format --check agenticore/ tests/

  unit:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'anton' }}
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit -v -m unit --cov=agenticore --timeout=60 --timeout-method=thread

  integration:
    needs: [unit, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'anton' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start Docker stack
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          echo "Waiting for Redis..."
          for i in $(seq 1 30); do
            docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U agenticore 2>/dev/null && break
            sleep 2
          done
          echo "Waiting for agenticore..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/health 2>/dev/null && break
            sleep 2
          done
          echo "All services ready"

      - name: Run integration tests
        run: python -m pytest tests/ -v -m integration --timeout=60 || echo "No integration tests yet"

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
