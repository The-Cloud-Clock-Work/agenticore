name: Dev Build

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build from"
        required: false
        default: "dev"
        type: string
      tag:
        description: "Image tag"
        required: false
        default: "dev"
        type: string

permissions:
  contents: read
  packages: write

env:
  REPO_LC: ${{ github.repository }}
  OWNER_LC: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image names
        run: |
          echo "REPO_LC=${REPO_LC,,}" >> "$GITHUB_ENV"
          echo "OWNER_LC=${OWNER_LC,,}" >> "$GITHUB_ENV"

      - name: Compute tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "agenticore=ghcr.io/${REPO_LC,,}:dev,ghcr.io/${REPO_LC,,}:dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ inputs.tag }}"
            echo "agenticore=ghcr.io/${REPO_LC,,}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agenticore
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.agenticore }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, anton]
    steps:
      - name: Rollout restart agenticore
        env:
          KUBECONFIG_B64: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kc
          trap 'rm -f /tmp/kc' EXIT
          ./kubectl --kubeconfig=/tmp/kc rollout restart statefulset/agenticore -n anton-dev
          ./kubectl --kubeconfig=/tmp/kc rollout status statefulset/agenticore -n anton-dev --timeout=180s
          rm -f kubectl
