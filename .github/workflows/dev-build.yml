name: Dev Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build from"
        required: false
        default: "main"
        type: string
      tag:
        description: "Image tag"
        required: false
        default: "dev"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agenticore
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-broker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: auth_broker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/auth-broker:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
